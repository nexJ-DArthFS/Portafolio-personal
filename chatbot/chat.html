<!DOCTYPE html>
<html lang="es" data-theme="verde">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <link rel="stylesheet" href="chat.css">
</head>

<body>
   

<div class="chatbot">


    <button
        id="chatbot-toggle"
        class="chatbot-toggle"
        aria-label="Abrir asistente"
        aria-expanded="false"
    >
        <span>AI</span>
    </button>

    <section
        id="chatbot-window"
        class="chatbot-window"
        aria-hidden="true"
    >

        <header class="chatbot-header">
            <div>
                <strong>Asistente</strong>
                <small>Portafolio personal</small>
            </div>

            <button
                id="chatbot-close"
                class="chatbot-close"
                aria-label="Cerrar asistente"
            >
                ×
            </button>
        </header>

        <div
            id="chatbot-messages"
            class="chatbot-messages"
            aria-live="polite"
        >
            <div class="chat-message bot">
                Hola. ¿Qué quieres conocer sobre el portafolio?
            </div>
        </div>

        <form id="chatbot-form" class="chatbot-input-area">

            <input
                id="chatbot-input"
                type="text"
                placeholder="Escribe un mensaje..."
                autocomplete="off"
                required
            >

            <button type="submit" aria-label="Enviar mensaje">
                →
            </button>

        </form>

    </section>
<script src="chat.js"></script>
</div>

</body>
